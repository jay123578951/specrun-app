schema: spec-driven

context: |
  OpenSpec 相容的桌面 spec 管理 App。
  技術棧：Vue 3 + Vite + UnoCSS + Pinia，本地 Nitro server，之後套 Tauri v2 外殼。
  引擎完全外包 openspec CLI（spawn + --json），不重新實作任何規格語意。
  慣例：change 一律切小、功能逐步堆疊，一次只開一個進行中的 change；
  寧可多個小 change 也不要一個大 change。

  詞彙墓碑——canonical 詞 ←（已廢勿用）。舊文件撞到已廢詞代表該段內容過期；
  之後任何決策推翻或改名了既有概念，定案當下在此加一行：
  - slideover（詳情滑出面板）← 窄軌、收合變形、ChangeRail（C7 add-detail-slideover 推翻）
  - park / unpark ← 暫存（Spectra 用語，本專案不沿用）
  - 麵包屑頁切換 ← 側欄 Specs/Archived 入口、側欄當前頁高亮（move-page-nav-to-breadcrumb 移除）
  - 品牌記號 ← Logo（側欄最上方那一段的稱呼，add-orb-logo 改名）

  操作流程驗證用的 dev server 起法（srun:feat 的操作流程驗證照這段起，跨 run 沿用）：
  - 先確認 5173 沒人在聽（`lsof -nP -iTCP:5173 -sTCP:LISTEN`）。有人在聽就停下來問人，不另起第二份
  - 啟動指令：`HOME=<暫存資料夾>/home pnpm dev`。vite 聽 127.0.0.1:5173，Nitro API 聽 localhost:3210，入口是 http://127.0.0.1:5173/
  - 帶 HOME 的原因：App 的專案清單存在 `$HOME/Library/Application Support/specrun-app/config.json`，換掉 HOME 才不會動到使用者自己的專案清單
  - 資料來源：在暫存資料夾建一個含 `openspec/` 的測試專案（git repo），用 `POST http://localhost:3210/api/projects`，body 為 `{"path":"<測試專案路徑>"}` 加進去
  - 沒有登入

